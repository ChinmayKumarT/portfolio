# Decap CMS — the browser editor at /admin.
# Saving writes a commit to this repository, which redeploys the site.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Update {{collection}} “{{slug}}”'
    create: 'Add {{collection}} “{{slug}}”'
    delete: 'Remove {{collection}} “{{slug}}”'

# Uploaded screenshots and icons land here.
media_folder: img/uploads
public_folder: /img/uploads

# Lets you run the editor against local files with `npx decap-server`.
local_backend: true

collections:
  - name: projects
    label: Projects
    label_singular: Project
    files:
      - name: list
        label: All projects
        file: content/projects.json
        format: json
        fields:
          - name: projects
            label: Projects
            widget: list
            label_singular: Project
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - name: slug
                label: Address name
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only']
                hint: Used in the page address and as the screenshot folder name under img/.
              - { name: url, label: Live link, widget: string, hint: 'Full address, including https://' }
              - { name: host, label: Link text, widget: string, hint: 'What the link shows, e.g. deva-demo.vercel.app' }
              - name: icon
                label: Icon
                widget: image
                required: false
                media_library: { config: { multiple: false } }
                hint: Optional small mark shown beside the project title. A square logo or SVG works best.
              - { name: summary, label: Summary, widget: text }
              - name: points
                label: Points
                widget: list
                field: { name: point, label: Point, widget: text }
              - name: meta
                label: Facts
                widget: list
                required: false
                summary: '{{fields.label}}: {{fields.value}}'
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
              - name: results
                label: Results table
                widget: list
                required: false
                summary: '{{fields.metric}}: {{fields.value}}'
                fields:
                  - { name: metric, label: Metric, widget: string }
                  - { name: value, label: Result, widget: string }

  - name: skills
    label: Skills
    files:
      - name: list
        label: All skills
        file: content/skills.json
        format: json
        fields:
          - name: skills
            label: Skills
            widget: list
            label_singular: Skill
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - name: icon
                label: Icon
                widget: image
                media_library: { config: { multiple: false } }
                hint: A single-colour SVG. The colour below is applied to it.
              - { name: color, label: Colour, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', 'A hex colour such as #3776AB'], hint: 'Dark enough to read on the pale card.' }
